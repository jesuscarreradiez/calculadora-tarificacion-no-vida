<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f1efe9; --border:#dcd8cd; --border-s:#bdb8ab;
  --text:#1d1d1b; --muted:#615e57; --faint:#8f8b83;
  --accent:#1b3a5e; --accent-2:#2c5a8a; --accent-l:#e7eef6; --accent-ll:#f3f7fb; --on-accent:#ffffff;
  --ok:#1f6a35; --ok-bg:#ecf6ef; --ok-b:#b5dcc1;
  --warn:#8a4a05; --warn-bg:#fdf4e7; --warn-b:#efcb91;
  --err:#8a1f1f; --err-bg:#fdf0f0; --err-b:#efbcbc;
  --t1:#1b3a5e; --t2:#1f6a35; --t3:#8a4a05; --t4:#5b2a7a; --t5:#13616a; --t8:#8a2846;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Courier New",monospace;
  --serif:Georgia,"Cambria","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --surface:#1d2127; --surface-2:#242931; --border:#323844; --border-s:#465061;
    --text:#e7e9ec; --muted:#a6acb6; --faint:#7d8592;
    --accent:#8db7e6; --accent-2:#a9c9ee; --accent-l:#233246; --accent-ll:#1f2a38; --on-accent:#0f1a26;
    --ok:#7fd29a; --ok-bg:#16291e; --ok-b:#2c5a3b;
    --warn:#f0b768; --warn-bg:#2d2414; --warn-b:#5f4a22;
    --err:#f19a9a; --err-bg:#311a1a; --err-b:#683030;
    --t1:#8db7e6; --t2:#7fd29a; --t3:#f0b768; --t4:#c9a2e8; --t5:#76c9d2; --t8:#f09ab0;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1d2127; --surface-2:#242931; --border:#323844; --border-s:#465061;
  --text:#e7e9ec; --muted:#a6acb6; --faint:#7d8592;
  --accent:#8db7e6; --accent-2:#a9c9ee; --accent-l:#233246; --accent-ll:#1f2a38; --on-accent:#0f1a26;
  --ok:#7fd29a; --ok-bg:#16291e; --ok-b:#2c5a3b;
  --warn:#f0b768; --warn-bg:#2d2414; --warn-b:#5f4a22;
  --err:#f19a9a; --err-bg:#311a1a; --err-b:#683030;
  --t1:#8db7e6; --t2:#7fd29a; --t3:#f0b768; --t4:#c9a2e8; --t5:#76c9d2; --t8:#f09ab0;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:15px;line-height:1.55;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
sub,sup{font-size:.72em;line-height:0}
a{color:var(--accent)}

/* ── Estructura de aplicación ── */
:root{--side:#10233a;--side-2:#183150;--side-t:#c9d6e6;--side-f:#8299b4;--side-on:#ffffff}
:root[data-theme="dark"]{--side:#0d1117;--side-2:#161c25;--side-t:#b8c2cf;--side-f:#6f7b8b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--side:#0d1117;--side-2:#161c25;--side-t:#b8c2cf;--side-f:#6f7b8b}}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-t);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3f7cc0,#1b3a5e);color:#fff;font-family:var(--serif);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{color:#fff;font-size:15px;font-weight:600}
.brand-t span{font-size:12px;color:var(--side-f)}
.search{padding:0 14px 10px}
.search input{width:100%;background:var(--side-2);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 11px;color:#fff;font-size:13.5px;outline:none}
.search input::placeholder{color:var(--side-f)}
.search input:focus{border-color:#4d8bd0}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px;scrollbar-width:thin;scrollbar-color:#2a4466 transparent}
.nv-sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-f);font-weight:700;padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--side-t);text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.3}
.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.nv.on{background:rgba(77,139,208,.22);color:var(--side-on);font-weight:600}
.nv-ico{width:20px;text-align:center;flex:none;font-size:14px}
.nv-ico b{display:inline-flex;width:20px;height:20px;border-radius:5px;background:var(--tc);color:#fff;font-size:11px;align-items:center;justify-content:center}
.nv-t{flex:1}
.nv-b{font-size:11px;background:rgba(255,255,255,.1);border-radius:10px;padding:1px 8px;color:var(--side-t)}
.nv.nv-ex{font-size:12.5px}
.nv-grp{margin:2px 0}
.nv-gh{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--side-t);padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13.5px}
.nv-gh:hover{background:rgba(255,255,255,.06);color:#fff}
.nv-num{display:inline-flex;min-width:22px;height:22px;padding:0 4px;border-radius:6px;background:rgba(255,255,255,.08);align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.nv-grp.open .nv-num{background:var(--tc);}
.nv-grp.open .nv-gh{color:#fff;font-weight:600}
.nv-tools{display:none;margin:2px 0 6px 21px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12)}
.nv-grp.open .nv-tools{display:block}
.nv-tools .nv{font-size:13px;padding:6px 10px;color:var(--side-f)}
.nv-tools .nv:hover{color:#fff}
.nv-tools .nv.on{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 2px 0 0 var(--tc)}
.nv-grp.off{display:flex;align-items:center;gap:10px;padding:8px 10px;opacity:.45;font-size:13px}
.prof{display:flex;align-items:flex-start;gap:8px;margin:0 14px 10px;padding:9px 11px;border-radius:8px;background:var(--side-2);font-size:12.5px;color:var(--side-t);cursor:pointer;line-height:1.35}
.prof input{margin-top:2px;accent-color:#4d8bd0}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.badge-off{font-size:11.5px;color:#7fd29a}
.theme-btn{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--side-t);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.theme-btn:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:52px;padding:0 22px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.menu{display:none;border:1px solid var(--border-s);background:var(--surface);border-radius:7px;width:36px;height:34px;cursor:pointer;font-size:16px}
.crumb{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .cur{color:var(--text);font-weight:600}
.crumb .sep{margin:0 8px;color:var(--faint)}
.scrim{display:none}
.wrap{width:100%;max-width:1380px;margin:0 auto;padding:22px 26px 70px}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu{display:inline-flex;align-items:center;justify-content:center}
  .bar{padding:0 14px}
}

/* ── Cabecera de página ── */
.page-h{margin:4px 0 14px}
.page-k{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.chip-n{background:var(--tc,var(--accent));color:#fff;border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:700}
.page-h h2{font-family:var(--serif);font-weight:normal;font-size:27px;line-height:1.2;color:var(--text)}
.page-h p{color:var(--muted);font-size:14px;max-width:860px;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.seg-b{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer}
.seg-b:hover{color:var(--text);border-color:var(--border-s)}
.seg-b.on{background:var(--tc);border-color:var(--tc);color:#fff}
details.formulas{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--tc);border-radius:8px;margin-bottom:16px}
details.formulas>summary{cursor:pointer;padding:9px 14px;font-size:13.5px;color:var(--muted);list-style:none;user-select:none}
details.formulas>summary::-webkit-details-marker{display:none}
details.formulas>summary::before{content:"▸ ";color:var(--faint)}
details.formulas[open]>summary::before{content:"▾ "}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 22px;padding:2px 16px 14px}
.fitem{font-size:13.5px;padding:6px 0;border-top:1px dashed var(--border)}
.fitem b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
.fx{font-family:var(--serif);font-size:14.5px}

/* ── Zona de trabajo ── */
.work{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:20px;align-items:start}
.panel.form{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow-y:auto;scrollbar-width:thin}
@media (max-width:1000px){.panel.form{position:static;max-height:none}}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.form{padding:14px 16px 16px}
.form-top{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.cuando{font-size:13px;color:var(--muted);background:var(--accent-ll);border-radius:6px;padding:8px 10px}
.cuando b{color:var(--text)}
.ex-sel{width:100%;padding:7px 9px;border:1px solid var(--border-s);border-radius:6px;background:var(--surface-2);font-size:13.5px}
fieldset{border:none;border-top:1px solid var(--border);padding:10px 0 4px;margin-top:6px}
legend{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700;padding-right:8px}
details.opt{border-top:1px solid var(--border);margin-top:8px;padding-top:6px}
details.opt>summary{cursor:pointer;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700;list-style:none;padding:4px 0;user-select:none}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::after{content:" +";color:var(--faint)}
details.opt[open]>summary::after{content:" −"}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:6px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>label{font-size:12.5px;color:var(--muted)}
.fld input[type=text],.fld select{width:100%;border:1px solid var(--border-s);border-radius:6px;padding:7px 9px;background:var(--accent-ll);color:var(--text);font-family:var(--mono);font-size:14px;outline:none}
.fld select{font-family:var(--sans);font-size:13.5px;background:var(--surface-2)}
.fld input:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l)}
.fld input.bad{border-color:var(--err);background:var(--err-bg)}
.fld .echo{font-size:11.5px;color:var(--faint);font-family:var(--mono);min-height:0}
.fld .help{font-size:11.5px;color:var(--faint);line-height:1.35}
.fld.chk{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1}
.fld.chk label{font-size:13.5px;color:var(--text)}
.info{grid-column:1/-1;font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:7px 9px;line-height:1.45}
.rows{grid-column:1/-1}
.rows table{width:100%;border-collapse:collapse}
.rows th{font-size:11.5px;color:var(--faint);font-weight:600;text-align:left;padding:0 4px 3px}
.rows td{padding:2px 3px}
.rows td input,.rows td select{width:100%;border:1px solid var(--border-s);border-radius:5px;padding:5px 6px;background:var(--accent-ll);font-family:var(--mono);font-size:13px;color:var(--text)}
.rows td select{font-family:var(--sans);background:var(--surface-2)}
.rows .rm{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;padding:0 4px}
.rows .rm:hover{color:var(--err)}
.rows .add{margin-top:5px;border:1px dashed var(--border-s);background:none;border-radius:5px;padding:3px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.btns{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding:8px 0 2px}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:7px;padding:10px 20px;font-size:15px;font-weight:600;cursor:pointer;flex:1}
.btn:hover{filter:brightness(1.08)}
.btn2{background:none;border:1px solid var(--border-s);border-radius:7px;padding:9px 14px;cursor:pointer;color:var(--muted);font-size:13.5px}
.btn2:hover{color:var(--text);border-color:var(--text)}

/* ── Resultados ── */
.res{padding:16px 18px 20px;min-height:200px}
.res-empty{color:var(--faint);font-size:14px;text-align:center;padding:60px 20px;line-height:1.7}
.res-empty .big{font-family:var(--serif);font-size:20px;color:var(--muted);margin-bottom:6px}
.res h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.res h3:first-child{margin-top:0}
.res h3::after{content:"";flex:1;border-top:1px solid var(--border)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px}
.tile{background:var(--surface-2);border-radius:8px;padding:9px 12px;border:1px solid var(--border)}
.tile .tl{font-size:12.5px;color:var(--muted);font-family:var(--serif)}
.tile .tv{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);word-break:break-all;margin-top:2px}
.tile .th{font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.35}
.tile.main{background:var(--accent-l);border-color:transparent}
.tile.main .tv{color:var(--accent);font-size:21px}
.steps{list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:8px 0 10px 36px;border-bottom:1px solid var(--border);font-size:14px}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(st);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent-l);color:var(--accent);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.steps .st{font-weight:600;margin-bottom:3px}
.steps .eq{font-family:var(--serif);font-size:15px;background:var(--surface-2);border-left:3px solid var(--tc);padding:6px 10px;margin:5px 0;border-radius:0 5px 5px 0;overflow-x:auto;line-height:1.7}
.steps .eq .v{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--accent)}
.tbl-wrap{overflow-x:auto;margin:6px 0 4px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{background:var(--surface-2);font-weight:600;color:var(--muted);text-align:left;padding:6px 9px;border-bottom:1px solid var(--border-s);white-space:nowrap}
table.t td{padding:5px 9px;border-bottom:1px solid var(--border);vertical-align:top}
table.t td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
table.t tr.hl td{background:var(--ok-bg);font-weight:600}
.tcap{font-size:13px;font-weight:600;margin-top:10px}
.note{font-size:13px;color:var(--muted);background:var(--accent-ll);border-left:3px solid var(--accent);padding:8px 11px;border-radius:0 6px 6px 0;margin:8px 0;line-height:1.5}
.warn{font-size:13px;color:var(--warn);background:var(--warn-bg);border-left:3px solid var(--warn);padding:8px 11px;border-radius:0 6px 6px 0;margin:8px 0}
.err{font-size:14px;color:var(--err);background:var(--err-bg);border:1px solid var(--err-b);padding:12px 14px;border-radius:8px}
.okb{color:var(--ok);font-weight:600}
.badb{color:var(--err);font-weight:600}
.res-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dif-ok{color:var(--ok)} .dif-mid{color:var(--warn)}
.busy{opacity:.55;pointer-events:none}

/* ── Qué estás calculando / respuesta de examen ── */
.que{background:var(--accent-ll);border:1px solid var(--accent-l);border-left:4px solid var(--tc,var(--accent));border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55}
.que-h{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--tc,var(--accent));margin-bottom:4px}
.que p{margin:3px 0}
.caja-examen{border:2px solid var(--accent);background:var(--surface);border-radius:8px;margin:18px 0 6px;padding:12px 16px 14px}
.caja-examen-header{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.caja-examen-header span{flex:1}
.ce-copy{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:600}
.ce-copy:hover{background:var(--accent);color:var(--on-accent)}
.caja-examen-body{font-family:var(--serif);font-size:15px;line-height:1.7}
.ce-p{margin:7px 0}
.ce-f{margin:4px 0 6px;padding:6px 12px;border-left:3px solid var(--accent-2);background:var(--accent-ll);border-radius:4px;font-size:14.5px}
.ce-f>div{margin:2px 0}
.ce-lab{font-family:var(--sans);font-weight:700;font-size:13.5px;margin-right:6px;color:var(--text)}
.caja-examen-body .eq{font-family:var(--serif);background:var(--surface-2);border-left:3px solid var(--tc,var(--accent));padding:5px 10px;margin:5px 0;border-radius:0 5px 5px 0;overflow-x:auto}
.caja-examen-body .v{font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--accent)}

/* ── Inicio ── */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;background:linear-gradient(135deg,#1b3a5e 0%,#2c5a8a 100%);color:#fff;border-radius:18px;padding:26px 28px;margin:4px 0 18px}
.hero h2{font-family:var(--serif);font-weight:normal;font-size:30px}
.hero p{opacity:.88;margin-top:6px;max-width:620px;font-size:14.5px}
.how{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.how-i{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 5px;font-size:13px}
.how-i span{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#fff;color:#1b3a5e;font-weight:700;font-size:12px;align-items:center;justify-content:center}

<script>
/* ════════════════════════════════════════════════════════════════
   MOTOR NUMÉRICO — Tarificación no Vida
   Todo se calcula en local (sin internet). Convención: las
   distribuciones representan PÉRDIDAS L = y (indemnización), y las

   ════════════════════════════════════════════════════════════════ */
'use strict';
const TNV = (function () {

  /* ───────── Funciones especiales ───────── */
  const SQ2PI = Math.sqrt(2 * Math.PI);

    const K = t < 4 ? 64 : t < 5 ? 40 : t < 6 ? 24 : 16;

    const z = x / Math.SQRT2, z2 = z * z;

    const erf = 2 / Math.sqrt(Math.PI) * Math.exp(-z2) * sum;

  function logPhi(x) {
    if (x < -3) return -0.5 * x * x - Math.log(SQ2PI) + Math.log(millsR(-x));
    return Math.log(Phi(x));
  }
  function PhiInv(p) {
    if (p <= 0) return -Infinity;
    if (p >= 1) return Infinity;
    const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
    const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01];
    const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
    const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00];
    const pl = 0.02425;
    let q, r, x;
    if (p < pl) {
      q = Math.sqrt(-2 * Math.log(p));
      x = (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
    } else if (p <= 1 - pl) {
      q = p - 0.5; r = q * q;
      x = (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    } else {
      q = Math.sqrt(-2 * Math.log(1 - p));
      x = -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);

    // refinamiento de Halley (trabajando en la cola más precisa)
    for (let i = 0; i < 2; i++) {

      const u = e * SQ2PI * Math.exp(x * x / 2);

    }

  }
  const LZ = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  function lgamma(x) {
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    x -= 1;
    let a = LZ[0];
    const t = x + 7.5;
    for (let i = 1; i < 9; i++) a += LZ[i] / (x + i);
    return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
  }
  function gammaFn(x) {
    if (x < 0.5) return Math.PI / (Math.sin(Math.PI * x) * gammaFn(1 - x));
    return Math.exp(lgamma(x));
  }
  function gser(a, x) {
    let ap = a, sum = 1 / a, del = sum;
    for (let n = 0; n < 100000; n++) {
      ap += 1; del *= x / ap; sum += del;
      if (Math.abs(del) < Math.abs(sum) * 1e-16) break;
    }
    return sum * Math.exp(-x + a * Math.log(x) - lgamma(a));
  }
  function gcf(a, x) {
    const FP = 1e-300;
    let b = x + 1 - a, c = 1 / FP, d = 1 / b, h = d;
    for (let i = 1; i < 100000; i++) {
      const an = -i * (i - a); b += 2;
      d = an * d + b; if (Math.abs(d) < FP) d = FP;
      c = b + an / c; if (Math.abs(c) < FP) c = FP;
      d = 1 / d; const del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-16) break;
    }
    return Math.exp(-x + a * Math.log(x) - lgamma(a)) * h;
  }
  function gammaP(a, x) { if (x <= 0) return 0; return x < a + 1 ? gser(a, x) : 1 - gcf(a, x); }
  function gammaQ(a, x) { if (x <= 0) return 1; return x < a + 1 ? 1 - gser(a, x) : gcf(a, x); }
  function betacf(x, a, b) {
    const FP = 1e-300, qab = a + b, qap = a + 1, qam = a - 1;
    let c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < FP) d = FP;
    d = 1 / d; let h = d;
    for (let m = 1; m < 100000; m++) {
      const m2 = 2 * m;
      let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP;
      c = 1 + aa / c; if (Math.abs(c) < FP) c = FP;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < FP) d = FP;
      c = 1 + aa / c; if (Math.abs(c) < FP) c = FP;
      d = 1 / d; const del = d * c; h *= del;
      if (Math.abs(del - 1) < 1e-16) break;
    }
    return h;
  }
  function betaI(x, a, b) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(x, a, b) / a : 1 - bt * betacf(1 - x, b, a) / b;
  }

  /* ───────── Raíces ───────── */
  function bisect(f, a, b, tol = 1e-15, it = 300) {
    let fa = f(a);
    for (let i = 0; i < it; i++) {
      const m = 0.5 * (a + b);
      if (m === a || m === b) break;
      const fm = f(m);
      if ((fm <= 0) === (fa <= 0)) { a = m; fa = fm; } else b = m;
      if (Math.abs(b - a) <= tol * Math.max(1, Math.abs(a) + Math.abs(b))) break;
    }
    return 0.5 * (a + b);
  }
  // Busca x creciente con g(x)=0, g creciente
  function solveIncreasing(g, x0, step) {
    let a = x0, b = x0 + step, ga = g(a), gb = g(b), k = 0;
    while (ga > 0 && k < 200) { b = a; gb = ga; step *= 2; a = a - step; ga = g(a); k++; }
    while (gb < 0 && k < 400) { a = b; ga = gb; step *= 2; b = b + step; gb = g(b); k++; }
    return bisect(g, a, b);
  }

  /* ───────── Cuadratura de Gauss-Legendre en z (u = Φ(z)) ───────── */
  const GLX = [-0.9061798459386640, -0.5384693101056831, 0, 0.5384693101056831, 0.9061798459386640];
  const GLW = [0.2369268850561891, 0.4786286704993665, 0.5688888888888889, 0.4786286704993665, 0.2369268850561891];
  const ZLO = -8.5, ZHI = 8.5;
  function glNodes(lo, hi, h, breaks) {
    const pts = [lo, hi];
    (breaks || []).forEach(b => { if (isFinite(b) && b > lo && b < hi) pts.push(b); });
    pts.sort((x, y) => x - y);
    const Z = [], W = [];
    for (let s = 0; s < pts.length - 1; s++) {
      const a = pts[s], b = pts[s + 1];
      if (b - a < 1e-14) continue;
      const n = Math.max(1, Math.ceil((b - a) / h)), hh = (b - a) / n;
      for (let j = 0; j < n; j++) {
        const c = a + (j + 0.5) * hh;
        for (let k = 0; k < 5; k++) { Z.push(c + 0.5 * hh * GLX[k]); W.push(0.5 * hh * GLW[k]); }
      }
    }
    return { z: Z, w: W };
  }
  let STD_NODES = null;
  function stdNodes() { if (!STD_NODES) STD_NODES = glNodes(ZLO, ZHI, 0.01); return STD_NODES; }

  /* ───────── Distribución discreta genérica (atoms) ───────── */
  function makeDisc(xs0, ps0, meta) {
    let idx = xs0.map((_, i) => i);
    let sorted = true;
    for (let i = 1; i < xs0.length; i++) if (xs0[i] < xs0[i - 1]) { sorted = false; break; }
    if (!sorted) idx.sort((i, j) => xs0[i] - xs0[j]);
    const n = idx.length;
    const xs = new Float64Array(n), ps = new Float64Array(n);
    let tot = 0;
    for (let i = 0; i < n; i++) { xs[i] = xs0[idx[i]]; ps[i] = ps0[idx[i]]; tot += ps[i]; }
    for (let i = 0; i < n; i++) ps[i] /= tot;
    const SP = new Float64Array(n + 1), SX = new Float64Array(n + 1);
    for (let i = n - 1; i >= 0; i--) { SP[i] = SP[i + 1] + ps[i]; SX[i] = SX[i + 1] + ps[i] * xs[i]; }
    const mean = SX[0];
    let v = 0;
    for (let i = 0; i < n; i++) v += ps[i] * (xs[i] - mean) * (xs[i] - mean);
    function firstAbove(x) { let lo = 0, hi = n; while (lo < hi) { const m = (lo + hi) >> 1; if (xs[m] > x) hi = m; else lo = m + 1; } return lo; }
    const D = {
      kind: 'disc', xs, ps, n, mean, var: v, sd: Math.sqrt(v), totalMass: tot,
      meta: meta || {},
      cdf(x) { return 1 - SP[firstAbove(x)]; },
      sf(x) { return SP[firstAbove(x)]; },
      pAt(x) { let s = 0; for (let i = 0; i < n; i++) if (Math.abs(xs[i] - x) <= 1e-12 * Math.max(1, Math.abs(x))) s += ps[i]; return s; },
      q(p) { // cuantil inferior inf{x: F(x) ≥ p}
        if (p <= 0) return xs[0];
        let lo = 0, hi = n - 1;
        while (lo < hi) { const m = (lo + hi) >> 1; if (1 - SP[m + 1] >= p - 1e-12) hi = m; else lo = m + 1; }
        return xs[lo];
      },
      VaR(mu) { return D.q(1 - mu); },
      SL(x) { const k = firstAbove(x); return SX[k] - x * SP[k]; },
      CVaR(mu) { const v = D.VaR(mu); return v + D.SL(v) / mu; },
      CVaRz(s) { return D.CVaR(Phi(s)); },
      distortion(g) { let r = 0; for (let i = 0; i < n; i++) r += xs[i] * (g(SP[i]) - g(SP[i + 1])); return r; },
      entropic(mu) {

        return (mx + Math.log(s)) / mu;
      },
      map(f) { const ys = new Array(n); for (let i = 0; i < n; i++) ys[i] = f(xs[i]); return makeDisc(ys, Array.from(ps)); },
      disc() { return D; },
      min: xs[0], max: xs[n - 1]
    };

  }

  /* ───────── Distribución continua genérica ───────── */
  function makeCont(o) {
    const D = Object.assign({ kind: 'cont' }, o);
    D.sd = Math.sqrt(o.var);
    const lo = (o.lo !== undefined) ? o.lo : -Infinity, hi = (o.hi !== undefined) ? o.hi : Infinity;
    function bracketInvert(fn, target, decreasing) {
      // fn monótona; busca x con fn(x)=target

      while (g(a) > 0 && k < 200) { if (isFinite(lo)) { a = lo; break; } a = a - s * Math.pow(2, k); k++; }

      while (g(b) < 0 && k < 2000) { const nb = isFinite(hi) ? Math.min(hi, b + s * Math.pow(2, k)) : b + s * Math.pow(2, k); if (nb === b) break; b = nb; k++; }

    D.q = p => {
      if (p <= 0) return lo; if (p >= 1) return hi;

    };
    D.qs = s => {
      if (s <= 0) return hi; if (s >= 1) return lo;

      const N = stdNodes();
      const x = new Array(N.z.length), p = new Array(N.z.length);
      for (let i = 0; i < N.z.length; i++) { x[i] = D.qz(N.z[i]); p[i] = N.w[i] * phi(N.z[i]); }
      G = { z: N.z, w: N.w, x, disc: makeDisc(x, p) };
      return G;
    };
    D.disc = () => D.grid().disc;
    if (!o.SL) D.SL = x => D.grid().disc.SL(x);
    if (o.CVaRz) D.CVaR = mu => o.CVaRz(PhiInv(mu));
    else { D.CVaR = mu => { if (mu >= 1) return o.mean; const v = D.VaR(mu); return v + D.SL(v) / mu; }; D.CVaRz = s => D.CVaR(Phi(s)); }
    // ∫ Q(Φ(z)) k(z) dz con núcleo k (para distorsiones)
    D.kernelInt = k => { const g = D.grid(); let r = 0; for (let i = 0; i < g.z.length; i++) r += g.w[i] * g.x[i] * k(g.z[i]); return r; };
    // E[h(L)] con puntos de quiebre en x (para franquicias y límites)
    D.expect = (h, breaksX) => {
      const bz = (breaksX || []).filter(b => b > lo && b < hi).map(b => D.zOf(b));
      const N = glNodes(ZLO, ZHI, 0.01, bz);
      let r = 0, tw = 0;
      for (let i = 0; i < N.z.length; i++) { const w = N.w[i] * phi(N.z[i]); r += w * h(D.qz(N.z[i])); tw += w; }
      return r / tw;
    };
    D.distortion = g => D.disc().distortion(g);
    D.entropic = mu => D.disc().entropic(mu);
    return D;

  };

  /* ───────── Registro ───────── */
  function tema(t) { TEMAS.push(t); }
  function tool(t) { TOOLS.push(t); }
  const toolById = id => TOOLS.find(t => t.id === id);
  const temaOf = n => TEMAS.find(t => t.n === n);
  const allFields = t => t.groups.flatMap(g => g.fields);

  /* ───────── Valores ───────── */
  function defaults(t) {
    const v = {};
    for (const f of allFields(t)) {
      if (f.type === 'rows') v[f.id] = (f.def || []).map(r => Object.assign({}, r));
      else if (f.type === 'check') v[f.id] = !!f.def;
      else if (f.type !== 'info') v[f.id] = f.def !== undefined ? String(f.def) : '';
    }
    return v;
  }
  function valsOf(t) {
    if (!state.vals[t.id]) {
      const saved = store.get('v:' + t.id);
      state.vals[t.id] = Object.assign(defaults(t), saved || {});
    }
    return state.vals[t.id];
  }
  function save(t) { store.set('v:' + t.id, state.vals[t.id]); }
  // Lector de valores con mensajes de error comprensibles
  function reader(t, raw) {
    const lab = {};
    for (const f of allFields(t)) lab[f.id] = (f.label || f.id).replace(/<[^>]+>/g, '');
    const R = {
      raw,
      n(id, opt) {
        const s = raw[id];
        if ((s === '' || s === undefined) && opt && opt.opt) return null;
        const x = T.parseNum(s);
        if (isNaN(x)) throw new Error(`Revisa el dato «${lab[id] || id}»: «${s === undefined ? '' : s}» no es un número.`);
        if (opt && opt.pos && !(x > 0)) throw new Error(`«${lab[id] || id}» debe ser positivo.`);
        if (opt && opt.prob && !(x > 0 && x < 1)) throw new Error(`«${lab[id] || id}» debe estar entre 0 y 1.`);
        return x;
      },
      nOpt(id) { return R.n(id, { opt: true }); },
      s(id) { return raw[id] === undefined ? '' : String(raw[id]); },
      b(id) { return !!raw[id]; },
      list(id, opt) {
        const s = R.s(id).trim();
        if (!s) { if (opt && opt.opt) return []; throw new Error(`Falta la lista «${lab[id] || id}».`); }
        const out = s.split(/[;|\n\t]+|\s{1,}(?=[\d+−-])/).map(x => x.trim()).filter(Boolean).map(x => { const v = T.parseNum(x); if (isNaN(v)) throw new Error(`«${x}» no es un número en «${lab[id] || id}». Separa los valores con «;».`); return v; });
        return out;
      },
      rows(id) {
        const f = allFields(t).find(x => x.id === id);
        return (raw[id] || []).map((r, i) => {
          const o = {};
          for (const c of f.cols) {
            if (c.type === 'sel' || c.type === 'text') { o[c.id] = r[c.id] !== undefined ? r[c.id] : (c.def || ''); continue; }
            const s = r[c.id];
            if ((s === '' || s === undefined) && c.opt) { o[c.id] = null; continue; }
            const x = T.parseNum(s);
            if (isNaN(x)) throw new Error(`Fila ${i + 1} de «${lab[id]}»: «${c.label}» no es un número.`);
            o[c.id] = x;
          }
          return o;
        });
      }
    };
    return R;
  }

  /* ───────── Constructor de resultados ───────── */
  function result() {
    const r = { tiles: [], blocks: [], steps: [], keys: {}, exam: [], que: [] };
    // respuesta de examen (prosa); lleva delante las fórmulas pendientes de r.uses()
    r.ans = (lab, html) => { r.exam.push({ lab, html, f: r.pend.splice(0) }); return r; };
    r.explain = html => { r.que.push(html); return r; };                // qué se está calculando
    r.usa = []; r.pend = [];   // fórmulas ya mostradas / pendientes para el siguiente párrafo
    r.uses = (...keys) => { for (const k of keys) if (FORMULAS[k] && !r.usa.includes(k)) { r.usa.push(k); r.pend.push(k); } return r; };
    r.tile = (l, v, o) => { r.tiles.push(Object.assign({ l, v }, o || {})); return r; };
    r.step = (title, html) => { r.steps.push({ title, html }); return r; };
    r.table = (title, head, rows, o) => { r.blocks.push(Object.assign({ k: 'table', title, head, rows }, o || {})); return r; };
    r.note = html => { r.blocks.push({ k: 'note', html }); return r; };
    r.warn = html => { r.blocks.push({ k: 'warn', html }); return r; };
    r.html = html => { r.blocks.push({ k: 'html', html }); return r; };
    r.key = (k, v) => { r.keys[k] = v; return r; };
    return r;
  }
  const eq = s => `<div class="eq">${s}</div>`;
  const v = (x, sig) => `<span class="v">${T.fmt(x, sig)}</span>`;

  /* ───────── Render de campos ───────── */
  function renderField(t, f, vals, onChange) {
    if (f.type === 'info') return h('div', { class: 'info', html: typeof f.html === 'function' ? f.html(vals) : f.html, 'data-f': f.id || '' });
    const wrap = h('div', { class: 'fld' + (f.wide ? ' wide' : '') + (f.type === 'check' ? ' chk' : '') + (f.type === 'rows' ? ' rows' : ''), 'data-f': f.id });
    const id = 'f_' + t.id + '_' + f.id;
    if (f.type === 'check') {
      const cb = h('input', { type: 'checkbox', id, onchange: e => { vals[f.id] = e.target.checked; onChange(f); } });
      cb.checked = !!vals[f.id];
      wrap.append(cb, h('label', { for: id, html: f.label }));
      if (f.help) wrap.append(h('div', { class: 'help', html: f.help, style: { gridColumn: '1/-1' } }));
      return wrap;
    }
    if (f.type === 'rows') {
      wrap.append(h('label', { html: f.label }));
      const tbl = h('table');
      const head = h('tr', null, f.cols.map(c => h('th', { html: c.label })), h('th'));
      tbl.append(head);
      const body = h('tbody');
      const draw = () => {
        body.innerHTML = '';
        (vals[f.id] || []).forEach((row, i) => {
          const tr = h('tr');
          for (const c of f.cols) {
            let inp;
            if (c.type === 'sel') {
              inp = h('select', { onchange: e => { row[c.id] = e.target.value; onChange(f); } }, c.opts.map(o => h('option', { value: o[0] }, o[1])));
              inp.value = row[c.id] !== undefined ? row[c.id] : c.def;
            } else {
              inp = h('input', { type: 'text', inputmode: c.type === 'text' ? 'text' : 'decimal', value: row[c.id] !== undefined ? row[c.id] : '', placeholder: c.ph || '', oninput: e => { row[c.id] = e.target.value; onChange(f, true); } });
            }
            tr.append(h('td', { style: c.w ? { width: c.w } : null }, inp));
          }
          tr.append(h('td', null, h('button', { class: 'rm', title: 'Quitar fila', type: 'button', onclick: () => { vals[f.id].splice(i, 1); draw(); onChange(f); } }, '×')));
          body.append(tr);
        });
      };
      draw();
      tbl.append(body);
      wrap.append(tbl, h('button', { class: 'add', type: 'button', onclick: () => { const r = {}; f.cols.forEach(c => r[c.id] = c.def !== undefined ? String(c.def) : ''); vals[f.id].push(r); draw(); onChange(f); } }, '+ añadir fila'));
      if (f.help) wrap.append(h('div', { class: 'help', html: f.help }));
      return wrap;
    }
    wrap.append(h('label', { for: id, html: f.label }));
    if (f.type === 'sel') {
      const s = h('select', { id, onchange: e => { vals[f.id] = e.target.value; onChange(f); } }, f.opts.map(o => h('option', { value: o[0] }, o[1])));
      s.value = vals[f.id];
      if (s.value !== vals[f.id]) { vals[f.id] = f.opts[0][0]; s.value = vals[f.id]; }
      wrap.append(s);
    } else {
      const echo = h('div', { class: 'echo' });
      const inp = h('input', {
        type: 'text', id, value: vals[f.id], placeholder: f.ph || '', inputmode: f.type === 'text' ? 'text' : 'decimal', autocomplete: 'off', spellcheck: 'false',
        oninput: e => { vals[f.id] = e.target.value; upd(); onChange(f, true); },
        onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); solveCurrent(); } }
      });
      const upd = () => {
        if (f.type !== 'num') return;
        const s = vals[f.id].trim(); const x = T.parseNum(s);
        inp.classList.toggle('bad', s !== '' && isNaN(x));
        const plain = /^[−-]?\d+([.,]\d+)?$/.test(s) && !/^\d{1,3}\.\d{3}$/.test(s);
        echo.innerHTML = (s !== '' && !isNaN(x) && !plain) ? '= ' + T.fmt(x, 12) : '';
      };
      upd();
      wrap.append(inp, echo);
    }
    if (f.help) wrap.append(h('div', { class: 'help', html: f.help }));
    return wrap;
  }
  function refreshVisibility(root, t, vals) {
    for (const f of allFields(t)) {
      if (!f.show) continue;
      const el = root.querySelector(`[data-f="${f.id}"]`);
      if (el) el.style.display = f.show(vals) ? '' : 'none';
    }
    root.querySelectorAll('[data-g]').forEach(g => {
      const grp = t.groups[+g.dataset.g];
      const vis = grp.fields.some(f => !f.show || f.show(vals));
      const gs = grp.show ? grp.show(vals) : true;
      g.style.display = vis && gs ? '' : 'none';
    });
    root.querySelectorAll('.info[data-f]').forEach(el => {
      const f = allFields(t).find(x => x.id === el.dataset.f);
      if (f && typeof f.html === 'function') el.innerHTML = f.html(vals);
    });
  }

  /* ───────── Render de resultados ───────── */
  function renderResult(t, r, ex) {
    const box = h('div');
    if (r.error) { box.append(h('div', { class: 'err', html: '⚠ ' + r.error })); return box; }
    const que = [t.que, ...r.que].filter(Boolean);
    if (que.length) box.append(h('div', { class: 'que' }, h('div', { class: 'que-h' }, 'Qué estás calculando'), ...que.map(q => h('p', { html: q }))));
    if (r.tiles.length) {
      box.append(h('h3', null, 'Resultado'));
      box.append(h('div', { class: 'tiles' }, r.tiles.map(x => h('div', { class: 'tile' + (x.main ? ' main' : '') },
        h('div', { class: 'tl', html: x.l }),
        h('div', { class: 'tv', html: typeof x.v === 'string' ? x.v : (x.pct ? T.fmtPct(x.v) : T.fmt(x.v, x.sig)) }),
        x.hint ? h('div', { class: 'th', html: x.hint }) : null))));
    }
    if (r.exam.length) {
      const body = h('div', { class: 'caja-examen-body' }, r.exam.map(p => p.f && p.f.length
        ? h('div', { class: 'ce-p' }, p.lab ? h('div', { class: 'ce-lab', html: p.lab }) : null,
          h('div', { class: 'ce-f' }, p.f.map(k => h('div', { html: FORMULAS[k] }))), h('div', { html: p.html }))
        : h('div', { class: 'ce-p' }, p.lab ? h('span', { class: 'ce-lab', html: p.lab }) : null, h('span', { html: p.html }))));
      if (r.pend.length) body.append(h('div', { class: 'ce-p ce-left' }, h('div', { class: 'ce-f' }, r.pend.map(k => h('div', { html: FORMULAS[k] })))));
      box.append(h('div', { class: 'caja-examen' },
        h('div', { class: 'caja-examen-header' }, h('span', null, 'Respuesta de examen — copia esto'),
          h('button', { class: 'ce-copy', type: 'button', onclick: e => copyText(body, e.target) }, 'Copiar respuesta')),
        body));
    }
    if (ex && ex.expect && ex.expect.length) {
      box.append(h('h3', null, 'Comparación con la solución del examen'));
      const rows = ex.expect.map(e => {
        const c = r.keys[e.k];
        let dif = '—', cls = '';
        if (typeof c === 'number' && typeof e.v === 'number' && isFinite(c)) {
          const d = (c - e.v) / (Math.abs(e.v) || 1);
          dif = (Math.abs(d) < 5e-9 ? '0' : (d > 0 ? '+' : '−') + T.fmt(Math.abs(d) * 100, 3)) + ' %';
          cls = Math.abs(d) < 1e-6 ? 'dif-ok' : (Math.abs(d) < 0.02 ? 'dif-mid' : '');
        }
        return h('tr', null, h('td', { html: e.l }), h('td', { class: 'n', html: typeof e.v === 'number' ? T.fmt(e.v) : e.v }), h('td', { class: 'n', html: typeof c === 'number' ? T.fmt(c) : (c || '—') }), h('td', { class: 'n ' + cls, html: dif }), h('td', { html: e.src || '' }));
      });
      box.append(h('div', { class: 'tbl-wrap' }, h('table', { class: 't' }, h('tr', null, ['Magnitud', 'Examen', 'Calculadora', 'Dif.', 'Cómo lo obtuvo el examen'].map(x => h('th', null, x))), rows)));
      if (ex.note) box.append(h('div', { class: 'note', html: ex.note }));
    }
    for (const b of r.blocks.filter(b => b.top)) box.append(renderBlock(b));
    if (r.steps.length) {
      box.append(h('h3', null, 'Procedimiento paso a paso'));
      box.append(h('ol', { class: 'steps' }, r.steps.map(s => h('li', null, h('div', { class: 'st', html: s.title }), h('div', { html: s.html || '' })))));
    }
    for (const b of r.blocks.filter(b => !b.top)) box.append(renderBlock(b));
    box.append(h('div', { class: 'res-actions' },
      h('button', { class: 'btn2', type: 'button', onclick: e => copyText(box, e.target) }, 'Copiar procedimiento'),
      h('button', { class: 'btn2', type: 'button', onclick: () => window.print() }, 'Imprimir')));
    return box;
  }
  function renderBlock(b) {
    if (b.k === 'note') return h('div', { class: 'note', html: b.html });
    if (b.k === 'warn') return h('div', { class: 'warn', html: '⚠ ' + b.html });
    if (b.k === 'html') return h('div', { html: b.html });
    if (b.k === 'table') {
      const d = h('div');
      if (b.title) d.append(h('h3', { html: b.title }));
      const tb = h('table', { class: 't' }, h('tr', null, b.head.map(x => h('th', { html: x }))));
      b.rows.forEach((row, i) => tb.append(h('tr', { class: (b.hl && b.hl(i)) ? 'hl' : '' }, row.map(c => typeof c === 'number' ? h('td', { class: 'n', html: T.fmt(c, b.sig) }) : h('td', { class: (typeof c === 'string' && /^[−\-+]?[\d.,]+( %)?$/.test(c)) ? 'n' : '', html: c === null || c === undefined ? '—' : String(c) })))));
      d.append(h('div', { class: 'tbl-wrap' }, tb));
      return d;
    }
    return h('div');
  }
  function copyText(box, btn) {
    const txt = box.innerText.replace(/Copiar (procedimiento|respuesta)\s*(Imprimir)?\s*/g, '').trim();
    const done = () => { const o = btn.textContent; btn.textContent = '✓ Copiado'; setTimeout(() => btn.textContent = o, 1400); };
    try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
    function fallback() { const ta = h('textarea'); ta.value = txt; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { } ta.remove(); }
  }

  /* ───────── Vistas (modo aplicación: barra lateral + contenido) ───────── */
  let ROOT, NAV, CRUMB, VIEWS = {};
  const closeDrawer = () => document.body.classList.remove('drawer');
  function navItem(label, opts) {
    return h('button', Object.assign({ type: 'button', class: 'nv' + (opts.on ? ' on' : '') + (opts.cls ? ' ' + opts.cls : ''), onclick: () => { closeDrawer(); opts.go(); } }, opts.style ? { style: opts.style } : {}),
      opts.ico ? h('span', { class: 'nv-ico', html: opts.ico }) : null, h('span', { class: 'nv-t', html: label }), opts.badge ? h('span', { class: 'nv-b' }, opts.badge) : null);
  }
  function renderNav() {
    NAV.innerHTML = '';
    const q = (document.getElementById('q').value || '').trim().toLowerCase();
    if (q) {
      const norm = x => String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/<[^>]+>/g, '');
      const qq = norm(q);
      const hits = [];
      for (const t of TOOLS) {
        if (norm(t.title + ' ' + t.short + ' ' + (t.cuando || '')).includes(qq)) hits.push(navItem(t.title, { ico: `<b>${t.tema}</b>`, style: { '--tc': temaOf(t.tema).color }, go: () => go(t.tema, t.id) }));
        for (const e of (t.examples || [])) if (norm(e.label).includes(qq)) hits.push(navItem(e.label, { ico: '📄', cls: 'nv-ex', style: { '--tc': temaOf(t.tema).color }, go: () => go(t.tema, t.id, e.id) }));
      }
      NAV.append(h('div', { class: 'nv-sec' }, hits.length ? `${hits.length} resultado${hits.length > 1 ? 's' : ''}` : 'Sin resultados'), ...hits.slice(0, 80));
      return;
    }
    NAV.append(navItem('Inicio', { ico: '⌂', on: state.tema === 0, go: () => go(0) }));
    const nEx = TOOLS.reduce((a, t) => a + (t.examples || []).length, 0);
    NAV.append(navItem('Ejercicios de examen', { ico: '📄', on: state.tema === 'ex', badge: String(nEx), go: () => go('ex') }));
    NAV.append(h('div', { class: 'nv-sec' }, 'Temario'));
    for (const tm of [...TEMAS].sort((a, b) => a.n - b.n)) {
      if (tm.off) { NAV.append(h('div', { class: 'nv-grp off' }, h('span', { class: 'nv-num' }, tm.offLabel || ''), h('span', null, 'Próximamente'))); continue; }

  /* ═════════ Utilidades comunes ═════════ */
  const level = sp => T.fmtPctLevel(1 - sp.mu);
  function normalCartera(n, E, sd, sp, Pi) {
    // aproximación normal de la cartera de n pólizas (TCL, tema 6)
    const mN = n * E, sN = Math.sqrt(n) * sd;
    const r01 = T.rhoStd(sp);
    const rhoN = sp.type === 'Entropica' ? mN + sp.mu * sN * sN / 2 : mN + r01 * sN;
    return { mN, sN, r01, rhoN, ploss: Pi !== null ? T.Phi(-(n * Pi - mN) / sN) : null };
  }

  UI.tool({
    id: 't1-dist', tema: 1, title: 'Momentos, probabilidades y cuantiles',
    short: 'Parámetros ↔ media y desviación, F(x), percentiles, exceso sobre un umbral.',
    cuando: 'te dan una severidad o un coste continuo (p. ej. «log-normal de media 1000 y desviación 250») y necesitas sus parámetros, probabilidades o percentiles.',
    que: 'Identifica la distribución continua del enunciado, pasa de sus parámetros a su media y desviación (o al revés) con las fórmulas del tema 1, y calcula probabilidades F(x), percentiles y lo que queda por encima de un umbral (útil para franquicias, límites y stop-loss).',
    groups: [
      { title: 'Distribución', fields: P.famFields('d_', P.CF, P.CF_ALL, 'lognormal') },
      {
        title: 'Consultas (opcionales)', fields: [
          { id: 'x', type: 'num', label: 'Valor x para F(x) = IP(y ≤ x)', def: '', ph: 'opcional' },
          { id: 'p', type: 'num', label: 'Probabilidad p para el cuantil', def: '0,95', help: 'Admite 0,95 o 95 %' },
          { id: 's', type: 'num', label: 'Umbral s (exceso, franquicia, límite)', def: '', ph: 'opcional', help: 'Calcula 𝔼((y − s)⁺), 𝔼(min{y, s}) y la cola por encima de s' }
        ]
      }
    ],
    solve(V, { result }) {
      const R = result();
      const b = P.buildFam(V, 'd_', P.CF), D = b.D;
      R.tile('𝔼(y)', D.mean, { main: true }).tile('σ(y)', D.sd, { main: true }).tile('σ²(y)', D.var).tile('Coef. de variación σ/𝔼', D.sd / D.mean);
      R.step('Identificación de la distribución', b.ex);
      R.key('E', D.mean).key('sd', D.sd);
      R.uses(b.fam === 'normal' ? 'norm2' : b.fam === 'lognormal' ? 'ln67' : (b.fam === 'gamma' || b.fam === 'exponencial') ? 'gam12' : b.fam === 'pareto' ? 'par17' : null);
      R.ans('Distribución.', `${b.ex} Por tanto, 𝔼(y) = ${vv(D.mean)} y σ(y) = ${vv(D.sd)}.`);
      const x = V.nOpt('x');
      if (x !== null) {
        const F = D.cdf(x);
        R.tile(`F(${f(x)}) = IP(y ≤ ${f(x)})`, F).tile(`IP(y > ${f(x)})`, 1 - F);
        let extra = '';
        if (b.fam === 'normal') extra = `IP(y ≤ x) = Φ((x − m)/s) = Φ(${f((x - D.mean) / D.sd, 8)})`;
        else if (b.fam === 'lognormal') extra = `IP(y ≤ x) = Φ((log x − m)/s) = Φ(${f((Math.log(x) - D.mu) / D.sg, 8)})`;
        else if (b.fam === 'exponencial') extra = `IP(y ≤ x) = 1 − e<sup>−x/β</sup> (ec. 11)`;
        else if (b.fam === 'pareto') extra = `IP(y ≤ x) = 1 − (β/(x+β))<sup>α</sup> (ec. 15)`;
        R.step('Función de distribución', (extra ? eq(extra + ` = ${vv(F)}`) : '') + `IP(y > ${f(x)}) = 1 − F(${f(x)}) = ${vv(1 - F)}` + (D.pdf ? `; densidad f(${f(x)}) = ${f(D.pdf(x))}` : ''));
        R.key('F', F);
        R.ans('Probabilidad.', `${extra ? extra + ' = ' + vv(F) : 'F(' + f(x) + ') = ' + vv(F)}, es decir, IP(y ≤ ${f(x)}) = ${vv(F)} e IP(y > ${f(x)}) = ${vv(1 - F)}.`);
      }
      let p = V.nOpt('p');
      if (p !== null) {
        if (p >= 1) p /= 100;
        if (!(p > 0 && p < 1)) throw new Error('La probabilidad p debe estar entre 0 y 1.');
        const q = D.q(p);
        R.tile(`Cuantil al ${T.fmtPctLevel(p)}`, q);
        let how = 'inversión numérica de F';
        if (b.fam === 'normal') how = `m + s·Φ<sup>−1</sup>(p) = ${f(D.mean)} + ${f(D.sd)}·${f(T.PhiInv(p), 8)}`;
        else if (b.fam === 'lognormal') how = `e<sup>m + sΦ⁻¹(p)</sup> = e<sup>${f(D.mu, 8)} + ${f(D.sg, 8)}·${f(T.PhiInv(p), 8)}</sup>`;
        else if (b.fam === 'exponencial') how = `−β·log(1 − p)`;
        else if (b.fam === 'pareto') how = `β((1 − p)<sup>−1/α</sup> − 1)`;
        R.step(`Cuantil (percentil ${T.fmtPctLevel(p)})`, eq(`F<sup>−1</sup>(${f(p)}) = ${how} = ${vv(q)}`) + `Coincide con VaR<sub>${T.fmtPctLevel(p)}</sub>(−y) si y es una pérdida (ec. 31).`);
        R.key('q', q); R.uses('var31');
        R.ans('Percentil.', `El percentil ${T.fmtPctLevel(p)} es F<sup>−1</sup>(${f(p)}) = ${how} = ${vv(q)}${p > 0.5 ? `, que coincide con VaR<sub>${T.fmtPctLevel(p)}</sub>(−y) si y representa pérdidas` : ''}.`);
      }
      const s = V.nOpt('s');
      if (s !== null) {
        const sl = D.SL(s), sf = D.sf ? D.sf(s) : 1 - D.cdf(s);
        R.tile(`𝔼((y − ${f(s)})<sup>+</sup>)`, sl).tile(`𝔼(min{y, ${f(s)}})`, D.mean - sl).tile(`𝔼(y − s | y > s)`, sl / sf);
        let auto = '';
        if (b.fam === 'exponencial') auto = `Autorréplica (prop. 1.3.2.2): (y − s)|y > s es otra exponencial de media ${f(D.mean)}.`;
        if (b.fam === 'pareto') auto = `Prop. 1.6.1: (y − s)|y > s es Pareto(α = ${f(D.al)}; β + s = ${f(D.be + s)}), de media ${f((D.be + s) / (D.al - 1))}.`;
        if (b.fam === 'gpd') auto = `Prop. 1.7.1: (y − s)|y > s es Pareto generalizada(ξ = ${f(D.xi)}; ξs + η = ${f(D.xi * s + D.eta)}).`;
        R.step(`Umbral s = ${f(s)}`, eq(`𝔼((y − s)<sup>+</sup>) = ${vv(sl)} &nbsp; (lo que paga una franquicia s, o un stop-loss de prioridad s)`) +
          eq(`𝔼(min{y, s}) = 𝔼(y) − 𝔼((y − s)<sup>+</sup>) = ${vv(D.mean - sl)} &nbsp; (indemnización máxima s)`) +
          eq(`IP(y > s) = ${vv(sf)}; &nbsp; 𝔼(y − s | y > s) = 𝔼((y − s)<sup>+</sup>)/IP(y > s) = ${vv(sl / sf)}`) + auto);
        R.key('sl', sl);
        R.ans(`Umbral ${f(s)}.`, `Por encima de s = ${f(s)} se tiene 𝔼((y − ${f(s)})<sup>+</sup>) = ${vv(sl)} (lo que pagaría una franquicia o un stop-loss de prioridad ${f(s)}), 𝔼(min{y, ${f(s)}}) = 𝔼(y) − 𝔼((y − ${f(s)})<sup>+</sup>) = ${vv(D.mean - sl)} e IP(y > ${f(s)}) = ${vv(sf)}. ${auto}`);
      }
      const ps = [0.5, 0.75, 0.9, 0.95, 0.99, 0.995];
      R.table('Percentiles', ['p', 'F<sup>−1</sup>(p)'], ps.map(q => [T.fmtPctLevel(q), D.q(q)]));
      return R;
    },
    examples: [
      { id: 'j26', label: 'Junio 2026 · Ej. 2 · severidad log-normal (1000; 250)', values: { d_fam: 'lognormal', d_lognormal_mode: 'mom', d_lognormal_mom_E: '1000', d_lognormal_mom_sd: '250', s: '1200' } },

  UI.tool({
    id: 't1-suma', tema: 1, title: 'Sumas de variables independientes',
    short: 'Combinaciones de normales, sumas de gammas o exponenciales (Erlang).',
    cuando: 'el enunciado suma variables: varias carteras normales independientes, «suma de dos exponenciales», etc.',
    que: 'Obtiene la distribución de una suma de variables independientes: una combinación lineal de normales sigue siendo normal (se suman medias y varianzas) y la suma de gammas con la misma escala β es otra gamma (Erlang si los α son enteros).',
    groups: [
      { title: 'Tipo de suma', fields: [{ id: 'tipo', type: 'sel', label: 'Variables', def: 'normal', opts: [['normal', 'Normales independientes: Σ cᵢ·yᵢ'], ['gamma', 'Gammas independientes con el mismo β']], wide: true }] },
      {
        title: 'Variables', fields: [
          { id: 'nr', type: 'rows', label: 'Normales N(mᵢ; sᵢ) con coeficiente cᵢ', cols: [{ id: 'c', label: 'cᵢ', def: '1' }, { id: 'm', label: 'mᵢ' }, { id: 's', label: 'sᵢ' }], def: [{ c: '1', m: '2.450.000', s: '221.359,4362' }, { c: '1', m: '1.500.000', s: '134.164,0786' }], show: v => v.tipo === 'normal' },
          { id: 'gr', type: 'rows', label: 'Gammas: parámetro αᵢ (exponencial ⇒ α = 1)', cols: [{ id: 'a', label: 'αᵢ' }], def: [{ a: '1' }, { a: '1' }], show: v => v.tipo === 'gamma' },
          { id: 'gb', type: 'num', label: 'β común (escala)', def: '100', show: v => v.tipo === 'gamma' }
        ]
      },
      { title: 'Consulta (opcional)', fields: [{ id: 'x', type: 'num', label: 'x para IP(suma ≤ x)', def: '', ph: 'opcional' }] }
    ],
    solve(V, { result }) {
      const R = result();
      let D;
      if (V.s('tipo') === 'normal') {
        const rows = V.rows('nr'); if (!rows.length) throw new Error('Añade al menos una normal.');
        const m = rows.reduce((a, r) => a + r.c * r.m, 0), v2 = rows.reduce((a, r) => a + r.c * r.c * r.s * r.s, 0);
        D = T.normal(m, Math.sqrt(v2));
        R.step('Combinación lineal de normales independientes (§1.1)', `Cualquier combinación lineal de normales independientes es normal:` +
          eq(`m = Σ cᵢmᵢ = ${rows.map(r => `${f(r.c)}·${f(r.m)}`).join(' + ')} = ${vv(m)}`) +
          eq(`s² = Σ cᵢ²sᵢ² = ${rows.map(r => `${f(r.c)}²·${f(r.s)}²`).join(' + ')} = ${f(v2)} ⇒ s = ${vv(Math.sqrt(v2))}`));
      } else {
        const rows = V.rows('gr'), be = V.n('gb', { pos: 1 }); if (!rows.length) throw new Error('Añade al menos una gamma.');
        const al = rows.reduce((a, r) => a + r.a, 0);
        D = T.gammaD(al, be);
        R.step('Suma de gammas de igual β (§1.4.5)', eq(`α = Σ αᵢ = ${rows.map(r => f(r.a)).join(' + ')} = ${vv(al)}, &nbsp; β = ${f(be)}`) + `La suma es Gamma(${f(al)}; ${f(be)})${Number.isInteger(al) ? ' — una Erlang' : ''}: 𝔼 = αβ = ${f(D.mean)}, σ² = αβ² = ${f(D.var)}.`);
      }
      R.uses(V.s('tipo') === 'normal' ? 'norm2' : 'gam12');
      R.tile('𝔼(suma)', D.mean, { main: true }).tile('σ(suma)', D.sd, { main: true }).tile('σ²(suma)', D.var);
      R.ans('', V.s('tipo') === 'normal' ? `Al ser una combinación lineal de normales independientes, la suma es normal de media ${vv(D.mean)} y desviación √(Σcᵢ²sᵢ²) = ${vv(D.sd)}, es decir, N(${f(D.mean)}; ${f(D.sd)}).` : `Al sumar gammas independientes con el mismo β = ${f(D.be)}, se obtiene una Gamma(α = ${f(D.al)}; β = ${f(D.be)}), con 𝔼 = αβ = ${vv(D.mean)} y σ = β√α = ${vv(D.sd)}.`);
      R.key('E', D.mean).key('sd', D.sd);
      const x = V.nOpt('x');
      if (x !== null) { R.tile(`IP(suma ≤ ${f(x)})`, D.cdf(x)); R.key('F', D.cdf(x)); }
      return R;
    },
    examples: [
      { id: 'e24', label: 'Enero 2024 · Ej. 2c · suma de las dos carteras (y + ỹ)', values: { tipo: 'normal', nr: [{ c: '1', m: '2.450.000', s: '221.359,4362' }, { c: '1', m: '1.500.000', s: '134.164,0786' }] } },

  UI.tool({
    id: 't2-freq', tema: 2, title: 'Distribución de la frecuencia N',

    cuando: 'necesitas IP(N = x), 𝔼(N), σ²(N), o pasar de una mixtura Poisson–Gamma a binomial negativa.',
    que: 'Describe el número de siniestros N: su media, su varianza y la tabla de probabilidades IP(N = x), junto con los parámetros (c, d) de la fórmula recurrente en la que se basa el método de Panjer.',
    groups: [
      { title: 'Frecuencia', fields: P.famFields('f_', P.FR, Object.keys(P.FR), 'binneg') },
      {
        title: 'Consultas (opcionales)', fields: [
          { id: 'x', type: 'num', label: 'Valor x para IP(N = x)', def: '', ph: 'opcional' },
          { id: 'kmax', type: 'num', label: 'Mostrar la tabla hasta x =', def: '', ph: 'automático' }
        ]
      }
    ],
    solve(V, { result }) {
      const R = result();
      const b = P.buildFam(V, 'f_', P.FR), N = b.D;
      R.tile('𝔼(N)', N.mean, { main: true }).tile('σ²(N)', N.var, { main: true }).tile('σ(N)', Math.sqrt(N.var)).tile('IP(N = 0)', N.pmf(0));
      R.step('Distribución de N', b.ex);
      R.key('E', N.mean).key('V', N.var).key('p0', N.pmf(0));
      R.uses(b.fam === 'poisson' ? 'pois' : b.fam === 'binneg' || b.fam === 'geometrica' ? 'nb24' : null); if (b.mode === 'pg') R.uses('pg29');
      R.ans('', `${b.ex} La probabilidad de no tener siniestros es IP(N = 0) = ${vv(N.pmf(0))}.`);
      if (N.ab) R.step('Fórmula recurrente (clase (c, d, 0), base del método de Panjer)', eq(`IP(N = x) = (c + d/x)·IP(N = x − 1), &nbsp; c = ${vv(N.ab.c)}, d = ${vv(N.ab.d)}`));
      const x = V.nOpt('x');
      if (x !== null) {
        const px = N.pmf(Math.round(x)), Fx = N.cdf(x);
        R.tile(`IP(N = ${f(x)})`, px).tile(`IP(N ≤ ${f(x)})`, Fx).tile(`IP(N > ${f(x)})`, 1 - Fx);
        R.key('px', px);
        R.ans('', `Además, IP(N = ${f(x)}) = ${vv(px)}, IP(N ≤ ${f(x)}) = ${vv(Fx)} e IP(N > ${f(x)}) = ${vv(1 - Fx)}.`);
      }
      let km = V.nOpt('kmax');
      if (km === null) { km = 0; let c = 0; while (c < 0.9999 && km < 40) { c += N.pmf(km); km++; } km = Math.max(km - 1, 5); }
      km = Math.min(200, Math.round(km));
      const rows = []; let c = 0;
      for (let k = 0; k <= km; k++) { const p = N.pmf(k); c += p; rows.push([String(k), p, c, Math.max(0, 1 - c)]); }
      R.table('Tabla de probabilidades', ['x', 'IP(N = x)', 'IP(N ≤ x)', 'IP(N > x)'], rows);
      return R;
    },
    examples: [

  UI.tool({
    id: 't2-suma', tema: 2, title: 'Suma de frecuencias independientes',
    short: 'Poisson + Poisson, BN de igual θ, binomiales de igual p.',
    cuando: 'agregas carteras o tipos de pólizas cuya frecuencia es de la misma familia.',
    que: 'Suma frecuencias independientes de la misma familia, que se mantiene: Poisson con Poisson, binomial negativa con el mismo θ, binomial con el mismo p.',
    groups: [
      { title: 'Familia', fields: [{ id: 'tipo', type: 'sel', label: 'Frecuencias', def: 'poisson', opts: [['poisson', 'Poisson(λᵢ)'], ['binneg', 'Binomial negativa(αᵢ; θ) con θ común'], ['binomial', 'Binomial(nᵢ; p) con p común']], wide: true }] },
      {
        title: 'Sumandos', fields: [
          { id: 'rows', type: 'rows', label: 'Parámetro de cada sumando (λᵢ, αᵢ o nᵢ)', cols: [{ id: 'k', label: 'Parámetro' }], def: [{ k: '0,5' }, { k: '1,2' }] },
          { id: 'th', type: 'num', label: 'θ común', def: '0,5', show: v => v.tipo === 'binneg' },
          { id: 'p', type: 'num', label: 'p común', def: '0,1', show: v => v.tipo === 'binomial' }
        ]
      }
    ],
    solve(V, { result }) {
      const R = result(); const rows = V.rows('rows'); const s = rows.reduce((a, r) => a + r.k, 0); const t = V.s('tipo');
      let N, txt;
      if (t === 'poisson') { N = T.poisson(s); txt = `La suma de Poisson independientes es Poisson de parámetro Σλᵢ = ${vv(s)} (§2.2).`; }
      else if (t === 'binneg') { const th = V.n('th', { prob: 1 }); N = T.negbin(s, th); txt = `La suma de BN independientes con el mismo θ es BN(Σαᵢ = ${vv(s)}; θ = ${f(th)}) (§2.3.1).`; }
      else { const p = V.n('p', { prob: 1 }); N = T.binomial(s, p); txt = `La suma de binomiales independientes con el mismo p es Bin(Σnᵢ = ${vv(s)}; p = ${f(p)}).`; }
      R.step('Distribución de la suma', txt);
      R.uses(t === 'poisson' ? 'pois' : t === 'binneg' ? 'nb24' : null);
      R.ans('', `${txt} Por tanto 𝔼(N) = ${vv(N.mean)} y σ²(N) = ${vv(N.var)}.`);
      R.tile('𝔼(N)', N.mean, { main: true }).tile('σ²(N)', N.var, { main: true }).tile('IP(N = 0)', N.pmf(0));
      R.key('E', N.mean).key('V', N.var);
      return R;
    }
  });

  /* ═════════ T3 · Coste agregado ═════════ */
  UI.tool({
    id: 't3-agregado', tema: 3, title: 'Coste agregado: frecuencia × severidad', tag: 'el más frecuente',
    short: 'Media, desviación, CVaR, prima, probabilidad de pérdida; franquicias e indemnizaciones máximas; cartera de n pólizas.',
    cuando: '«La frecuencia es … y la severidad es …». Sirve para los apartados de media, desviación, CVaR, prima, riesgo del asegurador, probabilidad de perder dinero y n mínimo de pólizas.',
    que: 'Construye la indemnización anual de una póliza y = S₁ + … + S<sub>N</sub> (composición de frecuencia y severidad, tema 3). La media y la desviación salen de la fórmula (26); el CVaR (o la medida elegida) necesita la distribución completa de y, que se obtiene discretizando la severidad y componiendo de forma exacta (equivale al método de Panjer; el profesor usa Monte Carlo). Con ello se calculan la prima, el riesgo que asume el asegurador y la probabilidad de perder dinero.',
    groups: [

      {
